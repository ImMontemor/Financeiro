.an>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.an>:nth-child(2){animation-delay:.05s}.an>:nth-child(3){animation-delay:.1s}.an>:nth-child(4){animation-delay:.15s}.an>:nth-child(n+5){animation-delay:.2s}

`<div class="cd hero"><small>Sobra do mês</small><div class="big" data-n="${c.sobra}">${fmt(c.sobra)}</div><div class="g3"><div><small>Receitas</small><b>${fmt(c.rec)}</b></div><div><small>Investido</small><b>${fmt(c.inv)}</b></div><div><small>Despesas</small><b>${fmt(c.des)}</b></div></div></div>
<div class="cd"><div class="bh"><b>Contas do mês</b><span class="chip ${pg==100?'ok':''}">${pg}% pagas</span></div><div class="bar"><i style="width:${pg}%"></i></div><div class="g3 mt"><div><small>Pago</small><b class="pos">${fmt(c.pago)}</b></div><div><small>A pagar</small><b class="neg">${fmt(c.des-c.pago)}</b></div><div><small>Carteira</small><b>${fmt(c.cart)}</b></div></div></div>`+
(al.length?`<div class="cd"><div class="bh"><b>Atenção</b><span class="chip er">${al.length}</span></div>${al.map(row).join('')}</div>`:'')+
`<div class="cd"><div class="bh"><b>Patrimônio</b></div><div class="big" style="font-size:28px" data-n="${bk+rs}">${fmt(bk+rs)}</div><div class="g3 g2"><div><small>Bancos</small><b>${fmt(bk)}</b></div><div><small>Reserva</small><b>${fmt(rs)}</b></div></div></div>
<div class="cd"><div class="bh"><b>Resumo de ${cur.y}</b><small>toque num mês</small></div><div class="bars">${Y.map((y,i)=>`<div class="mc ${i==cur.m?'on':''}" data-a="mj" data-m="${i}"><i style="height:${y.cart/mx*100}%;background:var(--ac)"></i><i style="height:${y.des/mx*100}%;background:var(--wn)"></i></div>`).join('')}</div><div class="lb">${MN.map(x=>`<span>${x[0]}</span>`).join('')}</div><div class="g3 mt"><div><small>Carteira</small><b>${fmt(tot('cart'))}</b></div><div><small>Gastos</small><b>${fmt(tot('des'))}</b></div><div><small>Investimento</small><b>${fmt(tot('inv'))}</b></div></div></div>`}
function vDesp(){const k=mk(),c=per(k,0),m=c.m,F=[['all','Todas'],['pd','Pendentes'],['pg','Pagas']];
const blk=p=>{const q=per(k,p),it=m.d.filter(x=>x.p==p&&(flt=='all'||(flt=='pg'?x.paid:!x.paid))).sort((a,b)=>(a.dt||'9')<(b.dt||'9')?-1:1);return`<section class="cd"><div class="bh"><b>${p}º Pagamento</b><button class="sm" data-a="add" data-p="${p}" aria-label="Adicionar">${ic('plus')}</button></div><div class="g3"><div><small>Carteira</small><b>${fmt(q.cart)}</b></div><div><small>Despesas</small><b>${fmt(q.des)}</b></div><div><small>Sobra</small><b class="${q.sobra<0?'neg':'pos'}">${fmt(q.sobra)}</b></div></div><div class="mt">${it.length?it.map(row).join(''):'<p class="em">Nenhuma despesa aqui</p>'}</div></section>`};
return cp()+`<div class="cd hero"><small>A pagar neste mês</small><div class="big" data-n="${c.des-c.pago}">${fmt(c.des-c.pago)}</div><div class="g3 g2"><div><small>Total de despesas</small><b>${fmt(c.des)}</b></div><div><small>Já pagas</small><b>${fmt(c.pago)}</b></div></div></div><div class="seg">${F.map(f=>`<button class="${flt==f[0]?'on':''}" data-a="flt" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`+blk(1)+blk(2)}
function vPt(){const r=D.pt.r,k=mk(),L=Object.keys(D.pt.d).filter(d=>d.startsWith(k)).sort().map(d=>({d,x:D.pt.d[d],p:pv(d,D.pt.d[d])})),T=L.reduce((s,y)=>s+y.p.v,0),X=L.reduce((s,y)=>s+y.p.x,0),W=['dom','seg','ter','qua','qui','sex','sáb'];
return`<div class="cd hero"><small>Horas extras do mês</small><div class="big" data-n="${T}">${fmt(T)}</div><div class="g3 g2"><div><small>Tempo extra</small><b>${fmtH(X)}</b></div><div><small>Dias lançados</small><b>${L.length}</b></div></div></div><div class="cd"><div class="bh"><b>Lançamentos</b><div class="gp"><button class="sm" data-a="rates" aria-label="Valores">${ic('cfg')}</button><button class="sm" data-a="addp" aria-label="Lançar dia">${ic('plus')}</button></div></div>${L.length?L.map(y=>`<div class="it"><div class="fx" data-a="edp" data-i="${y.d}"><b>${dm(y.d)} · ${W[new Date(y.d+'T00:00').getDay()]}</b><small>${y.x.en} às ${y.x.sa} · ${y.p.s?'sábado (valor fixo)':y.p.x?fmtH(y.p.x)+' extra':'sem extra'}</small></div><div class="rt"><b class="pos">${fmt(y.p.v)}</b></div></div>`).join(''):'<p class="em">Nenhum dia lançado. Toque em + para começar.</p>'}</div>${L.length?`<button class="b pr w" data-a="lnc" data-v="${T.toFixed(2)}">Lançar total nas receitas</button>`:''}<p class="em">Hora extra: ${fmt(r.e)} · Sábado: ${fmt(r.s)} · Saída padrão ${r.sa}</p>`}
function vRec(){const k=mk(),c=per(k,0),m=c.m,seg=`<div class="seg"><button class="${sub=='r'?'on':''}" data-a="sub" data-s="r">Receitas</button><button class="${sub=='p'?'on':''}" data-a="sub" data-s="p">Horas extras</button></div>`;if(sub=='p')return seg+vPt();
const blk=p=>{const q=per(k,p),it=m.r.filter(x=>x.p==p);return`<section class="cd"><div class="bh"><b>${p}º Pagamento</b><button class="sm" data-a="addr" data-p="${p}" aria-label="Adicionar">${ic('plus')}</button></div>${it.length?it.map(x=>`<div class="it"><div class="fx" data-a="edr" data-i="${x.id}"><b>${esc(x.n)}</b></div><div class="rt"><b class="pos">${fmt(x.v)}</b></div></div>`).join(''):'<p class="em">Sem receitas neste pagamento</p>'}<div class="g3 g2 mt"><div><small>Investimento</small><b>${fmt(q.inv)}</b></div><div><small>Carteira</small><b>${fmt(q.cart)}</b></div></div></section>`};
return seg+cp()+`<div class="cd hero"><small>Carteira do mês</small><div class="big" data-n="${c.cart}">${fmt(c.cart)}</div><div class="g3 g2"><div><small>Receita total</small><b>${fmt(c.rec)}</b></div><div><small>Investimento</small><b id="iv">${fmt(c.inv)}</b></div></div></div><div class="cd"><div class="bh"><b>Percentual para investir</b><b id="pc" class="pos">${m.pct||0}%</b></div><input type="range" id="pct" min="0" max="60" step="1" value="${m.pct||0}"></div>`+blk(1)+blk(2)}
const COL=['#0a8f8a','#3b82f6','#a855f7','#f59e0b','#ef4444','#06b6d4'];
function vBank(){const t=sum(D.b);return`<div class="cd hero"><small>Saldo total em bancos</small><div class="big" data-n="${t}">${fmt(t)}</div><small>${D.b.length} conta${D.b.length==1?'':'s'}</small></div>`+(D.b.length?D.b.map((b,i)=>`<div class="cd"><div class="gl"><div class="av" style="background:${COL[i%6]}">${esc((b.n[0]||'?').toUpperCase())}</div><div class="fx" data-a="ebk" data-i="${b.id}"><b>${esc(b.n)}</b><small>${b.t}</small></div><b class="${b.v<0?'neg':''}">${fmt(b.v)}</b></div><div class="ac"><button class="b" data-a="mv" data-w="b" data-i="${b.id}" data-s="1">+ Depositar</button><button class="b" data-a="mv" data-w="b" data-i="${b.id}" data-s="-1">− Retirar</button></div></div>`).join(''):'<p class="em">Nenhum banco ainda. Toque em + para adicionar.</p>')}
function vRes(){const t=sum(D.g);return`<div class="cd hero"><small>Total guardado</small><div class="big" data-n="${t}">${fmt(t)}</div><small>${D.g.length} meta${D.g.length==1?'':'s'}</small></div>`+(D.g.length?D.g.map(g=>{const p=g.g?Math.min(1,g.v/g.g):0;return`<div class="cd"><div class="gl"><svg class="rgs" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" class="r0"/><circle cx="40" cy="40" r="34" class="rg" style="stroke-dashoffset:${214*(1-p)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle">${Math.round(p*100)}%</text></svg><div class="fx" data-a="egl" data-i="${g.id}"><b>${esc(g.n)}</b><small>${fmt(g.v)} de ${fmt(g.g)}</small><small>${p>=1?'Meta alcançada! 🎉':'Faltam '+fmt(g.g-g.v)}</small></div></div><div class="ac"><button class="b" data-a="mv" data-w="g" data-i="${g.id}" data-s="1">+ Guardar</button><button class="b" data-a="mv" data-w="g" data-i="${g.id}" data-s="-1">− Retirar</button></div></div>`}).join(''):'<p class="em">Crie sua primeira meta, como a reserva de emergência.</p>')}
const TT={home:'Painel',desp:'Despesas',rec:'Receitas',bank:'Bancos',res:'Reserva'},NV=[['home','Painel'],['desp','Despesas'],['rec','Receitas'],['bank','Bancos'],['res','Reserva']];
function render(){const v={home:vHome,desp:vDesp,rec:vRec,bank:vBank,res:vRes}[tab](),a=anim;anim=0;
$('#app').innerHTML=`<header><h1>${TT[tab]}</h1><button class="ib" data-a="cfg" aria-label="Ajustes">${ic('cfg')}</button></header>${['home','desp','rec'].includes(tab)?`<div class="mn"><button class="ib" data-a="mm" data-d="-1" aria-label="Mês anterior">${ic('l')}</button><b>${MN[cur.m]} ${cur.y}</b><button class="ib" data-a="mm" data-d="1" aria-label="Próximo mês">${ic('r')}</button></div>`:''}<div class="${a?'an':''}">${v}</div>`;
$('#nv').innerHTML='<div>'+NV.map(n=>`<button class="${tab==n[0]?'on':''}" data-a="t" data-t="${n[0]}">${ic(n[0])}<span>${n[1]}</span></button>`).join('')+'</div>';
if(a&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/650);e.textContent=fmt(to*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}
function cfg(){const th=D.set.th;$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><div class="pn"><h3>Ajustes</h3><div class="it" style="border:0"><b class="fx">Sons e vibração</b><button class="tg ${D.set.snd?'on':''}" data-a="snd" aria-label="Sons"></button></div><div class="it"><b class="fx">Tema</b><div class="seg" style="margin:0;width:200px">${[['','Auto'],['light','Claro'],['dark','Escuro']].map(a=>`<button class="${th==a[0]?'on':''}" data-a="th" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div><div class="ac"><button class="b" data-a="bkp">Backup e restauração</button><button class="b dg" data-a="rst">Apagar tudo</button></div></div>`;$('#sh').className='sh on'}
const A={cls,cfg,
t:t=>{if(tab!=t.dataset.t){tab=t.dataset.t;flt='all';anim=1;SND.tap();hap(8);render();scrollTo(0,0)}},

add:t=>fIt('d',+t.dataset.p),edd:(t,i)=>fIt('d',0,getM(mk()).d.find(y=>y.id==i)),addr:t=>fIt('r',+t.dataset.p),edr:(t,i)=>fIt('r',0,getM(mk()).r.find(y=>y.id==i)),

bkp:()=>{$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><div class="pn"><h3>Backup</h3><p class="em" style="text-align:left">Copie este texto e guarde em um lugar seguro. Para restaurar, cole um backup aqui e toque em Restaurar.</p><textarea id="bt" rows="6">${esc(JSON.stringify(D))}</textarea><div class="ac"><button class="b" data-a="cpy">Copiar</button><button class="b pr" data-a="rsr">Restaurar</button></div></div>`},
cpy:()=>{const t=$('#bt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup copiado'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}},
rsr:()=>{try{const o=JSON.parse($('#bt').value);if(!o.m||!o.set)throw 0;Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,o);save();applyTh();cls();SND.ok();toast('Backup restaurado');anim=1;render()}catch(e){SND.err();toast('Backup inválido')}},
rst:t=>{if(!t.dataset.c){t.dataset.c=1;t.textContent='Toque de novo para confirmar';SND.err();return}Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,seed());save();applyTh();cls();toast('Dados apagados');anim=1;render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,t.dataset.i)});
