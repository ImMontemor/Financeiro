function vRec(){const k=mk(),c=per(k,0),m=c.m,seg=`<div class="seg"><button class="${sub=='r'?'on':''}" data-a="sub" data-s="r">Receitas</button><button class="${sub=='p'?'on':''}" data-a="sub" data-s="p">Horas extras</button></div>`;if(sub=='p')return seg+vPt();

return seg+cp()+`<div class="cd hero"><small>Carteira do mês</small><div class="big" data-n="${c.cart}">${fmt(c.cart)}</div><div class="g3 g2"><div><small>Receita total</small><b>${fmt(c.rec)}</b></div><div><small>Investimento</small><b id="iv">${fmt(c.inv)}</b></div></div></div><div class="cd"><div class="bh"><b>Percentual para investir</b><b id="pc" class="pos">${m.pct||0}%</b></div><input type="range" id="pct" min="0" max="60" step="1" value="${m.pct||0}"></div>`+blk(1)+blk(2)}
const COL=['#0a8f8a','#3b82f6','#a855f7','#f59e0b','#ef4444','#06b6d4'];
function vRes(){const t=sum(D.g);return`<div class="cd hero"><small>Total guardado</small><div class="big" data-n="${t}">${fmt(t)}</div><small>${D.g.length} meta${D.g.length==1?'':'s'}</small></div>`+(D.g.length?D.g.map(g=>{const p=g.g?Math.min(1,g.v/g.g):0;return`<div class="cd"><div class="gl"><svg class="rgs" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" class="r0"/><circle cx="40" cy="40" r="34" class="rg" style="stroke-dashoffset:${214*(1-p)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle">${Math.round(p*100)}%</text></svg><div class="fx" data-a="egl" data-i="${g.id}"><b>${esc(g.n)}</b><small>${fmt(g.v)} de ${fmt(g.g)}</small><small>${p>=1?'Meta alcançada! 🎉':'Faltam '+fmt(g.g-g.v)}</small></div></div><div class="ac"><button class="b" data-a="mv" data-w="g" data-i="${g.id}" data-s="1">+ Guardar</button><button class="b" data-a="mv" data-w="g" data-i="${g.id}" data-s="-1">− Retirar</button></div></div>`}).join(''):'<p class="em">Crie sua primeira meta, como a reserva de emergência.</p>')}
const TT={home:'Painel',desp:'Despesas',rec:'Receitas',bank:'Bancos',res:'Reserva',hist:'Histórico',mov:'Movimentações'},NV=[['home','Painel'],['desp','Despesas'],['rec','Receitas'],['bank','Bancos'],['res','Reserva']];
function render(){const v={home:vHome,desp:vDesp,rec:vRec,bank:vBank,res:vRes,hist:vHist,mov:vMov}[tab](),a=anim;anim=0;
$('#app').innerHTML=`<header><button class="ib" data-a="menu" aria-label="Menu">${ic('menu')}</button><h1>${TT[tab]}</h1><button class="ib" data-a="cfg" aria-label="Ajustes">${ic('cfg')}</button></header>${['home','desp','rec'].includes(tab)?`<div class="mn"><button class="ib" data-a="mm" data-d="-1" aria-label="Mês anterior">${ic('l')}</button><b>${MN[cur.m]} ${cur.y}</b><button class="ib" data-a="mm" data-d="1" aria-label="Próximo mês">${ic('r')}</button></div>`:''}<div class="${a?'an':''}">${v}</div>`;
$('#nv').innerHTML='<div>'+NV.map(n=>`<button class="${tab==n[0]?'on':''}" data-a="t" data-t="${n[0]}">${ic(n[0])}<span>${n[1]}</span></button>`).join('')+'</div>';
if(a&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/650);e.textContent=fmt(to*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}
function cfg(){const th=D.set.th;$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><div class="pn"><h3>Ajustes</h3><div class="it" style="border:0"><b class="fx">Sons e vibração</b><button class="tg ${D.set.snd?'on':''}" data-a="snd" aria-label="Sons"></button></div><div class="it"><b class="fx">Tema</b><div class="seg" style="margin:0;width:200px">${[['','Auto'],['light','Claro'],['dark','Escuro']].map(a=>`<button class="${th==a[0]?'on':''}" data-a="th" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div>${NP?capt():''}<div class="ac"><button class="b" data-a="bkp">Backup e restauração</button><button class="b dg" data-a="rst">Apagar tudo</button></div></div>`;$('#sh').className='sh on';NP&&NP.status().then(x=>{NS=x;const c=$('#cap small');c&&(c.textContent=nst())}).catch(()=>{})}
const A={cls,cfg,
menu:()=>{$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><aside class="dr"><h3>Financeiro 3.0</h3>${MI.map(m=>`<button class="mi ${m[0]==tab?'on':''}" data-a="go" data-t="${m[0]}">${ic(m[2])}<span>${m[1]}</span></button>`).join('')}</aside>`;$('#sh').className='sh on';SND.tap()},
go:t=>{const k=t.dataset.t;cls();if(TT[k]){tab=k;flt='all';anim=1;SND.tap();render();scrollTo(0,0)}else setTimeout(()=>({ntf,tema,bkp:()=>A.bkp(),cfg,sobre})[k](),120)},
aac:(t,i)=>fAcc(i),eac:(t,i)=>fAcc(bnk(i).id,accById(i)),sim:()=>{window.simNotif();SND.add()},
tm:t=>{D.set.th=t.dataset.v;save();applyTh();SND.tap();tema()},ta:t=>{D.set.ac=t.dataset.v;save();applyAc();SND.tap();tema()},
pal:(t,i)=>{$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><div class="pn"><h3>Cor do banco</h3><div class="sws">${PAL.map((c,k)=>`<button class="sw ${D.b.find(b=>b.id==i).c==k?'on':''}" style="background:${c}" data-a="pc" data-i="${i}" data-c="${k}"></button>`).join('')}</div></div>`;$('#sh').className='sh on';SND.tap()},
pc:(t,i)=>{D.b.find(b=>b.id==i).c=+t.dataset.c;save();cls();SND.add();render()},
imp:(t,i)=>{const x=INB.find(y=>y.id==i);x&&goImp(x)},dsc:(t,i)=>{SND.del();NP.remove({id:i}).then(chk)},nl:()=>NP.openListenerSettings(),nn:()=>NP.requestNotif(),na:()=>NP.openAppSettings(),
t:t=>{if(tab!=t.dataset.t){tab=t.dataset.t;flt='all';anim=1;SND.tap();hap(8);render();scrollTo(0,0)}},
mm:t=>{const d=new Date(cur.y,cur.m+ +t.dataset.d,1);cur={y:d.getFullYear(),m:d.getMonth()};anim=1;SND.tap();render()},
mj:t=>{cur.m=+t.dataset.m;tab='desp';anim=1;SND.tap();render()},
sub:t=>{sub=t.dataset.s;anim=1;SND.tap();render()},flt:t=>{flt=t.dataset.f;SND.tap();render()},
pay:(t,i)=>{const m=getM(mk()),x=m.d.find(y=>y.id==i);if(!x)return;x.paid=x.paid?0:1;save();x.paid?(SND.ok(),hap([12,40,12])):SND.tap();render();if(x.paid&&m.d.every(y=>y.paid))toast('Todas as contas do mês pagas! 🎉')},
add:t=>fIt('d',+t.dataset.p),edd:(t,i)=>fIt('d',0,getM(mk()).d.find(y=>y.id==i)),addr:t=>fIt('r',+t.dataset.p),edr:(t,i)=>fIt('r',0,getM(mk()).r.find(y=>y.id==i)),
ebk:(t,i)=>fBank(D.b.find(y=>y.id==i)),egl:(t,i)=>fGoal(D.g.find(y=>y.id==i)),mv:(t,i)=>fMov(t.dataset.w,i,+t.dataset.s),
addp:()=>fPt(),edp:(t,i)=>fPt(i),
fab:()=>({home:()=>fIt('d',1),desp:()=>fIt('d',1),rec:()=>sub=='p'?fPt():fIt('r',1),bank:()=>fBank(),res:()=>fGoal(),hist:()=>fIt('d',1),mov:()=>fIt('d',1)})[tab](),
rates:()=>sheet('Valores do ponto',[{k:'e',l:'Valor da hora extra (R$)',t:'money',v:D.pt.r.e},{k:'s',l:'Valor do sábado (R$)',t:'money',v:D.pt.r.s},{k:'sa',l:'Horário de saída padrão',t:'time',v:D.pt.r.sa},{k:'al',l:'Almoço (hh:mm)',t:'time',v:D.pt.r.al}],o=>Object.assign(D.pt.r,o)),
lnc:t=>{const m=getM(mk()),v=+t.dataset.v,x=m.r.find(y=>y.n=='Horas extras');x?x.v=v:m.r.push({id:uid(),n:'Horas extras',v,p:2});save();SND.ok();toast('Total lançado nas receitas');render()},
cpm:()=>{const s=D.m[key(cur.y,cur.m-1)];if(!s)return;const m=getM(mk());m.pct=s.pct;m.d=s.d.map(x=>({...x,id:uid(),paid:0,dt:x.dt?addM(x.dt,1):''}));m.r=s.r.map(x=>({...x,id:uid()}));save();SND.ok();toast('Mês copiado!');render()},
snd:()=>{D.set.snd=D.set.snd?0:1;save();SND.tap();cfg()},th:t=>{D.set.th=t.dataset.v;save();applyTh();SND.tap();cfg()},
bkp:()=>{$('#sh').innerHTML=`<div class="bk" data-a="cls"></div><div class="pn"><h3>Backup</h3><p class="em" style="text-align:left">Copie este texto e guarde em um lugar seguro. Para restaurar, cole um backup aqui e toque em Restaurar.</p><textarea id="bt" rows="6">${esc(JSON.stringify(D))}</textarea><div class="ac"><button class="b" data-a="cpy">Copiar</button><button class="b pr" data-a="rsr">Restaurar</button></div></div>`},
cpy:()=>{const t=$('#bt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup copiado'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}},
rsr:()=>{try{const o=JSON.parse($('#bt').value);if(!o.m||!o.set)throw 0;Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,o);save();applyTh();cls();SND.ok();toast('Backup restaurado');anim=1;render()}catch(e){SND.err();toast('Backup inválido')}},
rst:t=>{if(!t.dataset.c){t.dataset.c=1;t.textContent='Toque de novo para confirmar';SND.err();return}Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,seed());save();applyTh();cls();toast('Dados apagados');anim=1;render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,t.dataset.i)});
document.addEventListener('input',e=>{if(e.target.id=='pct'){const m=getM(mk());m.pct=+e.target.value;$('#pc').textContent=m.pct+'%';$('#iv').textContent=fmt(per(mk(),0).inv);tone(300+m.pct*8,.04,'sine',.02)}});
document.addEventListener('change',e=>{if(e.target.id=='pct'){save();render()}if(e.target.id=='pbk'){pbk=e.target.value;render()}});
applyAc();render();chk();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});addEventListener('focus',chk);
</script></body></html>
